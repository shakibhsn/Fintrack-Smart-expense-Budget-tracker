<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">
    <title>FinTrack — Smart Expense &amp; Budget Tracker</title>

    <!-- Apply the saved theme before first paint (no light/dark flash) -->
    <script>
        (function () {
            var pref = 'system';
            try { pref = localStorage.getItem('fintrack_theme') || 'system'; } catch (e) {}
            var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Design system: tokens -> base -> shared components -> shell layout. Feature CSS is loaded with its page. -->
    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/layout.css">
    <link rel="stylesheet" href="src/styles/shadcn.css">
    <link rel="stylesheet" href="dist/tailwind.css">

    <!-- Locally built Chart.js bundle; chart failures remain isolated to their own components. -->
    <script src="dist/chart.umd.js"></script>
    <script src="runtime-config.js"></script>
</head>
<body>
    <div id="app">
        <div style="min-height:100vh;display:grid;place-items:center" role="status" aria-label="Loading FinTrack"><span class="spinner" style="width:32px;height:32px"></span></div>
    </div>
    <noscript><p style="padding:24px;text-align:center">FinTrack needs JavaScript to run. Please enable it and reload.</p></noscript>
    <script type="module" src="src/main.js"></script>
</body>
</html>
