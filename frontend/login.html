<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#ECFDF5', 100: '#D1FAE5', 500: '#10B981', 600: '#059669', 700: '#047857' },
                        accent: { 500: '#6366F1', 600: '#4F46E5' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-app: #F8FAFC; --bg-card: #FFFFFF; --border-color: #E2E8F0;
            --text-main: #0F172A; --text-muted: #64748B; --input-bg: #F1F5F9;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        body { background-color: var(--bg-app); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-card { background-color: var(--bg-card); }
        .border-theme { border-color: var(--border-color); }
        .text-main { color: var(--text-main); }
        .text-muted { color: var(--text-muted); }
        .bg-input { background-color: var(--input-bg); }
        .tab-active { background-color: var(--bg-card); color: #059669; box-shadow: var(--shadow-lg); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Brand -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-brand-600 to-accent-500 flex items-center justify-center text-white text-xl font-extrabold shadow-md shadow-brand-500/20">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-brand-500 to-accent-500 bg-clip-text text-transparent">FinTrack</span>
                <span class="block text-[10px] font-bold tracking-wider text-muted uppercase">Smart Fintech</span>
            </div>
        </div>

        <div class="bg-card rounded-2xl border border-theme shadow-lg p-6 sm:p-8">
            <!-- Tabs -->
            <div class="grid grid-cols-2 gap-2 p-1 bg-input rounded-xl mb-6">
                <button type="button" id="tabLoginBtn" onclick="setAuthTab('login')" class="py-2.5 text-sm font-bold rounded-lg tab-active transition-all">Sign In</button>
                <button type="button" id="tabRegisterBtn" onclick="setAuthTab('register')" class="py-2.5 text-sm font-bold rounded-lg text-muted transition-all">Create Account</button>
            </div>

            <!-- Error banner -->
            <div id="authError" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-500 text-xs font-semibold"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-muted mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com" class="w-full bg-input rounded-xl px-3.5 py-2.5 text-sm text-main border border-transparent focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-muted mb-1">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-input rounded-xl px-3.5 py-2.5 text-sm text-main border border-transparent focus:border-brand-500 focus:outline-none">
                </div>
                <button type="submit" id="loginSubmitBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white text-sm font-bold py-2.5 rounded-xl shadow-md shadow-brand-500/20 transition-all-200 active:scale-95">
                    Sign In
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-muted mb-1">Full Name</label>
                    <input type="text" id="registerName" required placeholder="Jane Doe" class="w-full bg-input rounded-xl px-3.5 py-2.5 text-sm text-main border border-transparent focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-muted mb-1">Email Address</label>
                    <input type="email" id="registerEmail" required placeholder="you@example.com" class="w-full bg-input rounded-xl px-3.5 py-2.5 text-sm text-main border border-transparent focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-muted mb-1">Password</label>
                    <input type="password" id="registerPassword" required minlength="6" placeholder="At least 6 characters" class="w-full bg-input rounded-xl px-3.5 py-2.5 text-sm text-main border border-transparent focus:border-brand-500 focus:outline-none">
                </div>
                <button type="submit" id="registerSubmitBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white text-sm font-bold py-2.5 rounded-xl shadow-md shadow-brand-500/20 transition-all-200 active:scale-95">
                    Create Account
                </button>
            </form>
        </div>

        <p class="text-center text-[11px] text-muted mt-6">FinTrack API must be running at <code>http://localhost:5000</code></p>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';

        // If already logged in, skip straight to the app
        if (localStorage.getItem('fintrack_token')) {
            window.location.href = 'fintrack_application.html';
        }

        function setAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            hideError();

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.classList.add('tab-active');
                tabLoginBtn.classList.remove('text-muted');
                tabRegisterBtn.classList.remove('tab-active');
                tabRegisterBtn.classList.add('text-muted');
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabRegisterBtn.classList.add('tab-active');
                tabRegisterBtn.classList.remove('text-muted');
                tabLoginBtn.classList.remove('tab-active');
                tabLoginBtn.classList.add('text-muted');
            }
        }

        function showError(message) {
            const box = document.getElementById('authError');
            box.innerText = message;
            box.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('authError').classList.add('hidden');
        }

        function setButtonLoading(btn, loading, label) {
            btn.disabled = loading;
            btn.innerText = loading ? 'Please wait...' : label;
        }

        function completeAuth(user, token) {
            localStorage.setItem('fintrack_token', token);
            localStorage.setItem('fintrack_user', JSON.stringify(user));
            window.location.href = 'fintrack_application.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const btn = document.getElementById('loginSubmitBtn');
            setButtonLoading(btn, true, 'Sign In');

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const json = await res.json();
                if (!res.ok || !json.success) {
                    throw new Error(json.message || 'Login failed');
                }
                completeAuth(json.data.user, json.data.token);
            } catch (err) {
                showError(err.message || 'Could not reach the FinTrack API. Is the backend running?');
            } finally {
                setButtonLoading(btn, false, 'Sign In');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const btn = document.getElementById('registerSubmitBtn');
            setButtonLoading(btn, true, 'Create Account');

            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;

            try {
                const res = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const json = await res.json();
                if (!res.ok || !json.success) {
                    throw new Error(json.message || 'Registration failed');
                }
                completeAuth(json.data.user, json.data.token);
            } catch (err) {
                showError(err.message || 'Could not reach the FinTrack API. Is the backend running?');
            } finally {
                setButtonLoading(btn, false, 'Create Account');
            }
        });
    </script>
</body>
</html>
