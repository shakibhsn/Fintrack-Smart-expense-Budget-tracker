name: Deploy

# MANUAL and OFF BY DEFAULT. Nothing here runs until the repository variable DEPLOY_ENABLED is "true" and the GitHub Environment (staging / production)
# exists with its variables. Production should require reviewers on its Environment so a human approves each release.
# AWS access uses GitHub's OIDC identity (a short-lived role), so NO AWS access keys are stored anywhere.
# This workflow implements the architecture recommended in docs/deployment/ARCHITECTURE.md: static frontend on S3 + CloudFront, API container on AWS App Runner
# (image in ECR), PostgreSQL on RDS. If you choose a different hosting option, change only the "deploy" steps.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}      # variables below are defined per environment: AWS_ROLE_ARN, AWS_REGION, ECR_REPOSITORY, APPRUNNER_SERVICE_ARN, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, API_URL, APP_URL
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---- API image -> ECR -> App Runner ----
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the API image (tagged with the commit SHA, so every release can be rolled back to)
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Roll the App Runner service to the new image
        run: |
          aws apprunner update-service --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}" \
            --source-configuration "ImageRepository={ImageIdentifier=$IMAGE,ImageRepositoryType=ECR,ImageConfiguration={Port=5000}}"
      - name: Wait for the API to be READY (database + background jobs), fail the deploy otherwise
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' "${{ vars.API_URL }}/health/ready" || true)
            if [ "$code" = "200" ] && grep -q "\"$GITHUB_SHA\"" /tmp/ready.json; then cat /tmp/ready.json; exit 0; fi
            sleep 10
          done
          echo "API did not become ready with this release"; cat /tmp/ready.json || true; exit 1

      # ---- frontend -> S3 -> CloudFront ----
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build the frontend and write the environment's runtime config
        working-directory: frontend
        run: |
          npm ci && npm run build
          printf "window.FINTRACK_CONFIG = { apiBaseUrl: '%s' };\n" "${{ vars.API_URL }}" > runtime-config.js
      - name: Upload (immutable cache for built assets, no-cache for HTML and config) and invalidate CloudFront
        working-directory: frontend
        run: |
          B="s3://${{ vars.FRONTEND_BUCKET }}"
          aws s3 sync dist  "$B/dist"  --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync src   "$B/src"   --delete --cache-control "no-cache"
          aws s3 cp runtime-config.js "$B/runtime-config.js" --cache-control "no-cache"
          for f in index.html login.html fintrack_application.html; do aws s3 cp "$f" "$B/$f" --cache-control "no-cache"; done
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*.html" "/runtime-config.js" "/src/*"
      - name: Smoke test the public site
        run: |
          curl -sf "${{ vars.APP_URL }}/login.html" >/dev/null
          curl -sf "${{ vars.API_URL }}/health" >/dev/null
          echo "Deployed ${{ github.sha }} to ${{ inputs.environment }}"
